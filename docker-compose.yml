services:
  postgres:
    image: postgres:18.0
    container_name: reservation-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reservation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_reservation:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-reservation}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_reservation:
